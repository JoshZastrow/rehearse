# data — fill train_data with path to your sessions.jsonl before training
data:
  train_data: ''
  eval_data: ''
  shuffle: true

# model — downloads weights from HuggingFace on first run (~14GB)
moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"

full_finetuning: false
lora:
  enable: true
  rank: 128
  scaling: 2.
  ft_embed: false

first_codebook_weight_multiplier: 100.
text_padding_weight: 0.5

# optimizer
duration_sec: 100
batch_size: 16
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 2.0e-6
  weight_decay: 0.1
  pct_start: 0.05

# logging and checkpointing
seed: 0
log_freq: 1
eval_freq: 100
do_eval: false
do_ckpt: true
ckpt_freq: 100
save_adapters: true

run_dir: ''

# wandb — key is injected from WANDB_API_KEY env var at runtime; do not set here
# wandb:
#   project: ""
#   run_name: ""
#   offline: false
