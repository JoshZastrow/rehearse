name: playwright-web

on:
  pull_request:
    paths:
      - "web/livekit/app/**"
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/livekit/app/package-lock.json

      - name: Install dependencies
        working-directory: web/livekit/app
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web/livekit/app
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: web/livekit/app
        env:
          VITE_LIVEKIT_URL: ws://localhost:7880
          VITE_TOKEN_ENDPOINT: http://localhost:8765/api/livekit/token
        run: npm run build

      - name: Start Vite preview
        working-directory: web/livekit/app
        run: npx vite preview --port 5173 &

      - name: Wait for preview server
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run Playwright tests
        working-directory: web/livekit/app
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/livekit/app/playwright-report/
          retention-days: 7
