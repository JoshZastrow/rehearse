[project]
name = "rehearse"
version = "0.1.0"
description = "Voice agent inference engine for real-time conversation coaching. Prototype ML system for continual learning from live sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.39",
    "hume>=0.13",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
    "google-genai>=0.3",
    "rich>=13.7",
    "duckdb>=1.1",
    "honcho-ai>=2.1",
    "pg0-embedded>=0.14.1",
    "psycopg[binary]>=3.3.4",
    "modal>=0.73",
    "pocket-tts>=2.1.0",
    "faster-whisper>=1.1.0",
    "litellm[proxy]>=1.40",
    "httpx>=0.27",
    "websockets>=13.0",
    "chz>=0.4",
    "pyyaml>=6.0",
    "fire>=0.6",
    "simple-parsing>=0.1",
    "safetensors>=0.4",
    "tensorboard>=2.0",
    "sphn>=0.1.12",
    "submitit>=1.5",
    "moshi",
]

[project.optional-dependencies]
pipeline = [
    "pocket-tts>=2.1.0",
    "faster-whisper>=1.1.0",
]
moshi = [
    "sentencepiece>=0.2.0",
]

[project.scripts]
rehearse-eval = "rehearse.eval.cli:main"
rehearse-hume = "rehearse.services.hume_configs_cli:main"
rehearse-train = "rehearse.train.cli:main"
rehearse-init = "rehearse.cli.init:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1",
    "deepeval>=3.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live_api and not live_modal'"
markers = [
    "live_api: hits real provider APIs; requires sourced .env. Deselected by default. Run with `pytest -m live_api`.",
    "live_modal: hits a deployed Modal endpoint; requires VLLM_BASE_URL. Deselected by default. Run with `pytest -m live_modal`.",
    "slow: loads ML models, takes >10s",
    "pipeline: requires faster-whisper + pocket-tts installed",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.uv]
# litellm[proxy] has no wheels for Python 3.14+ / emscripten.
# Constrain resolution to the platforms this project actually targets.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.workspace]
members = [
    "dev/lab",
]

[tool.uv.sources]
moshi = { git = "https://github.com/kyutai-labs/moshi.git", subdirectory = "moshi" }
